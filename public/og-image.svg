<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WinDrop — Gift Lottery Luck">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.5" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1a288f"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3563ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3563ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-mark" x1="90" y1="230" x2="240" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3563ff"/>
      <stop offset="0.55" stop-color="#6d5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="og-drop" x1="120" y1="240" x2="210" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edff"/>
    </linearGradient>
    <linearGradient id="og-word" x1="300" y1="230" x2="1000" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8eb5ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Confetti -->
  <g opacity="0.9">
    <rect x="980" y="70" width="26" height="12" rx="3" fill="#facc15" transform="rotate(24 993 76)"/>
    <rect x="1080" y="150" width="22" height="10" rx="3" fill="#22c55e" transform="rotate(-18 1091 155)"/>
    <rect x="900" y="200" width="18" height="18" rx="4" fill="#ec4899" transform="rotate(12 909 209)"/>
    <circle cx="1120" cy="330" r="9" fill="#3563ff"/>
    <rect x="1030" y="430" width="24" height="11" rx="3" fill="#facc15" transform="rotate(-28 1042 435)"/>
    <circle cx="960" cy="500" r="8" fill="#22c55e"/>
    <rect x="150" y="80" width="20" height="10" rx="3" fill="#6d5cf6" transform="rotate(18 160 85)"/>
    <circle cx="90" cy="520" r="7" fill="#facc15"/>
    <rect x="1140" y="560" width="18" height="18" rx="4" fill="#a78bfa" transform="rotate(20 1149 569)"/>
  </g>

  <!-- Icon mark -->
  <g transform="translate(96,214)">
    <rect width="180" height="180" rx="44" fill="url(#og-mark)"/>
    <path d="M90 34C111 67.2 130.6 92.5 130.6 115.7a40.6 40.6 0 1 1-81.2 0C49.4 92.5 69 67.2 90 34Z" fill="url(#og-drop)"/>
    <path d="M90 88c2.8 12 6.3 15.5 18.3 18.3C96.3 109 92.8 112.5 90 124.5c-2.8-12-6.3-15.5-18.3-18.3C83.7 103.5 87.2 100 90 88Z" fill="#facc15"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="308" y="330" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="130" font-weight="900" letter-spacing="-4">
    <tspan fill="#ffffff">Win</tspan><tspan fill="url(#og-word)">Drop</tspan>
  </text>
  <text x="312" y="404" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="700" fill="#c7d2fe">Gift Lottery Luck</text>

  <!-- Footer strip -->
  <text x="96" y="566" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="600" fill="#8ea0c9">Gift Megapot tickets to any wallet on Base · One tap, big wins</text>
</svg>
