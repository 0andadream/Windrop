<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.5" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1a288f"/>
    </linearGradient>
    <linearGradient id="p-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3563ff"/><stop offset="0.55" stop-color="#6d5cf6"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="p-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8eb5ff"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="p-cel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.35" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#3563ff" stop-opacity="0.3"/><stop offset="1" stop-color="#3563ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#p-bg)"/>
  <rect width="1280" height="800" fill="url(#p-glow)"/>

  <!-- confetti -->
  <g opacity="0.85">
    <rect x="1180" y="80" width="22" height="10" rx="3" fill="#facc15" transform="rotate(24 1191 85)"/>
    <circle cx="1120" cy="200" r="8" fill="#22c55e"/>
    <rect x="620" y="60" width="16" height="16" rx="4" fill="#ec4899" transform="rotate(15 628 68)"/>
    <circle cx="90" cy="360" r="7" fill="#facc15"/>
    <rect x="1200" y="700" width="18" height="18" rx="4" fill="#a78bfa" transform="rotate(20 1209 709)"/>
  </g>

  <!-- Brand lockup -->
  <g transform="translate(80,70)">
    <rect width="60" height="60" rx="16" fill="url(#p-grad)"/>
    <path d="M30 11C37 22 43.6 30.5 43.6 38.4a13.6 13.6 0 1 1-27.2 0C16.4 30.5 23 22 30 11Z" fill="#fff"/>
    <path d="M30 29c1 4 2.1 5.2 6.1 6.1-4 1-5.1 2.1-6.1 6.1-1-4-2.1-5.2-6.1-6.1C27.9 34.2 29 33 30 29Z" fill="#facc15"/>
  </g>
  <text x="156" y="112" font-family="Inter, sans-serif" font-size="40" font-weight="900" letter-spacing="-1"><tspan fill="#fff">Win</tspan><tspan fill="url(#p-word)">Drop</tspan></text>

  <!-- Headline -->
  <text x="80" y="250" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">Gift lottery luck,</text>
  <text x="80" y="330" font-family="Inter, sans-serif" font-size="72" font-weight="900" letter-spacing="-2"><tspan fill="#ffffff">right from</tspan><tspan fill="url(#p-word)">&#160;X</tspan></text>
  <text x="80" y="392" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#aab6da">A WinDrop button on every profile.</text>

  <!-- X action-row mock -->
  <g transform="translate(80,470)">
    <rect x="-4" y="-4" width="620" height="150" rx="24" fill="#15171c" stroke="#252b36" stroke-width="1.5"/>
    <text x="24" y="40" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#6b7280">On any X profile…</text>
    <!-- More (dots) -->
    <circle cx="44" cy="95" r="22" fill="none" stroke="#3a4150" stroke-width="2"/>
    <circle cx="35" cy="95" r="2.6" fill="#e7e9ea"/><circle cx="44" cy="95" r="2.6" fill="#e7e9ea"/><circle cx="53" cy="95" r="2.6" fill="#e7e9ea"/>
    <!-- Bell -->
    <circle cx="100" cy="95" r="22" fill="none" stroke="#3a4150" stroke-width="2"/>
    <path d="M100 84c-5 0-8 3-8 8v5l-2 3h20l-2-3v-5c0-5-3-8-8-8Z" fill="none" stroke="#e7e9ea" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="100" cy="106" r="2.5" fill="#e7e9ea"/>
    <!-- Following pill -->
    <rect x="132" y="73" width="128" height="44" rx="22" fill="none" stroke="#536471" stroke-width="1.5"/>
    <text x="196" y="101" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#e7e9ea">Following</text>
    <!-- WinDrop button (highlighted) -->
    <rect x="276" y="73" width="182" height="44" rx="22" fill="url(#p-grad)"/>
    <!-- ticket glyph -->
    <g transform="translate(300,86)">
      <rect x="0" y="0" width="26" height="18" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="13" y1="2" x2="13" y2="16" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 2"/>
    </g>
    <text x="392" y="101" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="800" fill="#fff">WinDrop</text>
    <!-- callout -->
    <path d="M470 96 C 520 96, 520 60, 500 52" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="4 4"/>
    <path d="M500 52 l 10 2 l -6 8 Z" fill="#facc15"/>
    <text x="512" y="48" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#facc15">one tap</text>
  </g>

  <!-- Popup mock -->
  <g transform="translate(880,150)">
    <rect x="0" y="0" width="320" height="500" rx="22" fill="#0b1120" stroke="#26304f" stroke-width="1.5"/>
    <!-- header -->
    <path d="M0 22 a22 22 0 0 1 22 -22 h276 a22 22 0 0 1 22 22 v56 h-320 Z" fill="url(#p-grad)"/>
    <g transform="translate(18,20)">
      <rect width="40" height="40" rx="11" fill="#ffffff" opacity="0.15"/>
      <path d="M20 7C24.6 14.7 30 20.6 30 26a10 10 0 1 1-20 0C10 20.6 15.4 14.7 20 7Z" fill="#fff"/>
      <path d="M20 19c.7 2.8 1.5 3.6 4.3 4.3-2.8.7-3.6 1.5-4.3 4.3-.7-2.8-1.5-3.6-4.3-4.3C18.5 22.6 19.3 21.8 20 19Z" fill="#facc15"/>
    </g>
    <text x="70" y="35" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#fff">WinDrop</text>
    <text x="70" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#eef2ff">Gift Lottery Luck</text>
    <!-- body -->
    <text x="22" y="110" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8ea0c9">RECIPIENT ON X</text>
    <rect x="22" y="122" width="276" height="46" rx="14" fill="#141a33" stroke="#22c55e" stroke-width="2"/>
    <text x="38" y="151" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#e7e9ea">@vitalik</text>
    <!-- count -->
    <rect x="22" y="188" width="44" height="44" rx="12" fill="#1c2544"/>
    <text x="44" y="217" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">−</text>
    <text x="160" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="900" fill="url(#p-word)">5</text>
    <rect x="254" y="188" width="44" height="44" rx="12" fill="#1c2544"/>
    <text x="276" y="217" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#fff">+</text>
    <text x="160" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8ea0c9">TICKETS</text>
    <!-- presets -->
    <g font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">
      <rect x="22" y="266" width="48" height="34" rx="9" fill="#1c2544"/><text x="46" y="288">1</text>
      <rect x="76" y="266" width="48" height="34" rx="9" fill="#3563ff"/><text x="100" y="288">5</text>
      <rect x="130" y="266" width="48" height="34" rx="9" fill="#1c2544"/><text x="154" y="288">10</text>
      <rect x="184" y="266" width="48" height="34" rx="9" fill="#1c2544"/><text x="208" y="288">25</text>
      <rect x="238" y="266" width="60" height="34" rx="9" fill="url(#p-cel)"/>
      <!-- die -->
      <g fill="#fff"><circle cx="258" cy="278" r="2.4"/><circle cx="268" cy="283" r="2.4"/><circle cx="278" cy="288" r="2.4"/></g>
    </g>
    <!-- total -->
    <text x="22" y="336" font-family="Inter, sans-serif" font-size="13" fill="#8ea0c9">Total</text>
    <text x="298" y="338" text-anchor="end" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#fff">5 <tspan fill="#3563ff" font-size="13">USDC</tspan></text>
    <!-- cta -->
    <rect x="22" y="360" width="276" height="48" rx="15" fill="url(#p-grad)"/>
    <text x="160" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#fff">Gift 5 tickets</text>
    <text x="160" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#5c6a90">Opens WinDrop on Base · Powered by Megapot</text>
  </g>

  <!-- footer -->
  <text x="80" y="720" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#8ea0c9">Non-custodial · No tracking · Powered by Megapot on Base</text>
</svg>
